name: Telegram Scheduled Bots

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-scheduled-bots
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduled bots
        env:
          BOT_01_TOKEN: ${{ secrets.BOT_01_TOKEN }}
          BOT_02_TOKEN: ${{ secrets.BOT_02_TOKEN }}
          BOT_03_TOKEN: ${{ secrets.BOT_03_TOKEN }}
          BOT_04_TOKEN: ${{ secrets.BOT_04_TOKEN }}
          BOT_05_TOKEN: ${{ secrets.BOT_05_TOKEN }}
        run: python bot.py

      - name: Save subscriber data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscribers/subscribers.json subscribers/state.json subscribers/sent.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram bot state"
            git push
          fi
